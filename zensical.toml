[project]
site_url = "https://saetron.github.io/grimmory-proxy/"
site_name = "grimmory-proxy | Komga API Emulation for Grimmory"
site_description = "Restore Komga API emulation for Grimmory. Connect Mihon, Tachiyomi, Panels, and Komic to Grimmory 3.x+ with full Komga v1.12.0 protocol parity."
site_author = "Saetron"
copyright = "Copyright &copy; 2026 Saetron"

repo_url = "https://github.com/Saetron/grimmory-proxy"
repo_name = "Saetron/grimmory-proxy"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Reader Apps Setup" = "clients.md" },
  { "Deployment & Proxy" = "deployment.md" },
  { "Configuration" = "configuration.md" },
  { "API Endpoints" = "endpoints.md" },
  { "Interactive API" = "api-reference.md" },
  { "Architecture & Dev" = "development.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
