name: Cleanup Old Packages

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete package versions not matching 1.8
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'grimmory-proxy'
          package-type: 'container'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: 1
          ignore-versions: '^(1\.8|latest)$'
