name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Explicit version override (leave empty to automatically increase by 0.1)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Test, Bump Version & Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bump version by 0.1
        id: bump
        run: |
          NEW_VER=$(python -c "
          import sys
          from decimal import Decimal
          from pathlib import Path

          ver_file = Path('VERSION')
          current = ver_file.read_text(encoding='utf-8').strip() if ver_file.exists() else '0.1'
          override = '${{ github.event.inputs.version_override }}'.strip()

          if override:
              new_ver = override
          else:
              try:
                  parts = current.split('.')
                  major = int(parts[0])
                  minor = int(parts[1]) + 1
                  new_ver = str(major) + '.' + str(minor)
              except Exception:
                  new_ver = '1.12'

          ver_file.write_text(new_ver + '\n', encoding='utf-8')

          # Also update README.md badge
          readme_file = Path('README.md')
          if readme_file.exists():
              import re
              txt = readme_file.read_text(encoding='utf-8')
              txt = re.sub(r'badge/Version-v[0-9.]+-orange\.svg', f'badge/Version-v{new_ver}-orange.svg', txt)
              readme_file.write_text(txt, encoding='utf-8')

          # Also update SECURITY.md supported version table
          sec_file = Path('SECURITY.md')
          if sec_file.exists():
              import re
              sec_txt = sec_file.read_text(encoding='utf-8')
              sec_txt = re.sub(r'\| [0-9.]+\.x\s*\| :white_check_mark:', f'| {new_ver}.x  | :white_check_mark:', sec_txt)
              sec_txt = re.sub(r'\| < [0-9.]+\s*\| :x:', f'| < {new_ver}  | :x:', sec_txt)
              sec_file.write_text(sec_txt, encoding='utf-8')

          print(new_ver)
          ")
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "New Version: $NEW_VER"

      - name: Run Test Suite
        env:
          DATABASE_PATH: ./data/test_bridge.db
          THUMBNAILS_DIR: ./data/test_thumbnails
        run: |
          pytest -v

      - name: Commit and tag new release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION README.md SECURITY.md
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
            git tag -f "v${{ steps.bump.outputs.version }}"
            git push origin HEAD --tags -f || git push origin "v${{ steps.bump.outputs.version }}" || true
          else
            echo "Release version already committed and tagged."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.bump.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.bump.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          VERSION="${RELEASE_VERSION}"
          TAG="v${VERSION}"
          python -c "
          import os, re
          from pathlib import Path

          version = os.environ.get('RELEASE_VERSION', '').strip() or Path('VERSION').read_text(encoding='utf-8').strip()
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = rf'## \[{re.escape(version)}(?:\.0)?\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, changelog, re.DOTALL)
          notes = match.group(1).strip() if match else f'Release v{version}'
          Path('release_notes.md').write_text(notes, encoding='utf-8')
          "
          gh release create "$TAG" --title "$TAG" --notes-file release_notes.md || gh release edit "$TAG" --title "$TAG" --notes-file release_notes.md
