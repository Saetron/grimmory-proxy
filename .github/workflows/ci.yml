name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: "Explicit version override (leave empty to automatically increase by 0.1)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Test, Bump Version & Build Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bump version by 0.1
        id: bump
        run: |
          NEW_VER=$(python -c "
          import sys
          from decimal import Decimal
          from pathlib import Path

          ver_file = Path('VERSION')
          current = ver_file.read_text(encoding='utf-8').strip() if ver_file.exists() else '0.1'
          override = '${{ github.event.inputs.version_override }}'.strip()

          if override:
              new_ver = override
          else:
              try:
                  d = Decimal(current)
                  new_ver = str((d + Decimal('0.1')).quantize(Decimal('0.1')))
              except Exception:
                  new_ver = '0.2'

          ver_file.write_text(new_ver + '\n', encoding='utf-8')
          print(new_ver)
          ")
          echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "New Version: $NEW_VER"

      - name: Run Test Suite
        env:
          DATABASE_PATH: ./data/test_bridge.db
          THUMBNAILS_DIR: ./data/test_thumbnails
        run: |
          pytest -v

      - name: Commit and tag new release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.bump.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
